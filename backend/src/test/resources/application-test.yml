spring:
  datasource:
    url: jdbc:h2:mem:ledgerstream-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

management:
  health:
    redis:
      enabled: false

debug: false

logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.security: WARN

ledgerstream:
  kafka:
    market-tick-consumer-enabled: false
    order-created-consumer-enabled: false
