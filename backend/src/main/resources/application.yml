spring:
  application:
    name: ledgerstream-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerstream}
    username: ${SPRING_DATASOURCE_USERNAME:ledgerstream}
    password: ${SPRING_DATASOURCE_PASSWORD:ledgerstream-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.ledgerstream: INFO
