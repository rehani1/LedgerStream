spring:
  application:
    name: ledgerstream-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerstream}
    username: ${SPRING_DATASOURCE_USERNAME:ledgerstream}
    password: ${SPRING_DATASOURCE_PASSWORD:ledgerstream-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.ledgerstream: INFO

ledgerstream:
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Idempotency-Key
      - X-Request-ID
    exposed-headers:
      - X-Request-ID
    allow-credentials: true
    max-age: 3600s
  jwt:
    issuer: ${BACKEND_JWT_ISSUER:ledgerstream-local}
    secret: ${BACKEND_JWT_SECRET:replace-with-local-development-secret}
    access-token-ttl: ${BACKEND_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${BACKEND_JWT_REFRESH_TOKEN_TTL:7d}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    latest-quote-key-prefix: ${BACKEND_REDIS_LATEST_QUOTE_PREFIX:latest_quote}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer-group-id: ${BACKEND_KAFKA_CONSUMER_GROUP:ledgerstream-backend}
    connectivity-consumer-enabled: ${BACKEND_KAFKA_CONNECTIVITY_CONSUMER_ENABLED:false}
    market-tick-consumer-enabled: ${BACKEND_MARKET_TICK_CONSUMER_ENABLED:true}
    order-created-consumer-enabled: ${BACKEND_ORDER_CREATED_CONSUMER_ENABLED:true}
    retry-max-attempts: ${BACKEND_KAFKA_RETRY_MAX_ATTEMPTS:3}
    retry-backoff: ${BACKEND_KAFKA_RETRY_BACKOFF:2s}
    dead-letter-suffix: ${BACKEND_KAFKA_DEAD_LETTER_SUFFIX:.DLT}
    security-protocol: ${BACKEND_KAFKA_SECURITY_PROTOCOL:}
    sasl-mechanism: ${BACKEND_KAFKA_SASL_MECHANISM:}
    sasl-username: ${BACKEND_KAFKA_SASL_USERNAME:}
    sasl-password: ${BACKEND_KAFKA_SASL_PASSWORD:}
    sasl-jaas-config: ${BACKEND_KAFKA_SASL_JAAS_CONFIG:}
  market-replay:
    enabled: ${MARKET_DATA_REPLAY_ENABLED:false}
    tick-topic: ${MARKET_DATA_TICK_TOPIC:market.tick}
    replay-speed: ${MARKET_DATA_REPLAY_SPEED:1.0}
  rate-limit:
    enabled: ${BACKEND_RATE_LIMIT_ENABLED:true}
    login:
      enabled: ${BACKEND_RATE_LIMIT_LOGIN_ENABLED:true}
      max-requests: ${BACKEND_RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
      window: ${BACKEND_RATE_LIMIT_LOGIN_WINDOW:1m}
    registration:
      enabled: ${BACKEND_RATE_LIMIT_REGISTRATION_ENABLED:true}
      max-requests: ${BACKEND_RATE_LIMIT_REGISTRATION_MAX_REQUESTS:3}
      window: ${BACKEND_RATE_LIMIT_REGISTRATION_WINDOW:10m}
    order-creation:
      enabled: ${BACKEND_RATE_LIMIT_ORDER_CREATION_ENABLED:true}
      max-requests: ${BACKEND_RATE_LIMIT_ORDER_CREATION_MAX_REQUESTS:60}
      window: ${BACKEND_RATE_LIMIT_ORDER_CREATION_WINDOW:1m}
    quote-stream:
      enabled: ${BACKEND_RATE_LIMIT_QUOTE_STREAM_ENABLED:true}
      max-requests: ${BACKEND_RATE_LIMIT_QUOTE_STREAM_MAX_REQUESTS:20}
      window: ${BACKEND_RATE_LIMIT_QUOTE_STREAM_WINDOW:1m}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    email: ${DEMO_USER_EMAIL:demo@example.com}
    password: ${DEMO_USER_PASSWORD:replace-with-local-demo-password}
    initial-cash: ${DEMO_USER_INITIAL_CASH:100000.00}
    admin-enabled: ${DEMO_ADMIN_SEED_ENABLED:false}
    admin-email: ${DEMO_ADMIN_EMAIL:admin@example.com}
    admin-password: ${DEMO_ADMIN_PASSWORD:replace-with-local-demo-admin-password}
